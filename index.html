<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a37">
  <title>線上點餐</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script type="module" src="order.js"></script>
</head>
<body class="customer">
  <header class="top">
    <div class="top-row">
      <h1 id="shopName">線上點餐</h1>
      <span class="table-badge" id="tableBadge" hidden></span>
    </div>
    <p id="tagline"></p>
    <p class="online" id="online" hidden></p>
  </header>

  <div class="banner" id="offline" hidden>連線中斷,重新連線中…</div>
  <div class="banner warn" id="closedBanner" hidden></div>

  <nav class="cats" id="cats" hidden></nav>

  <main>
    <div class="loading" id="loading"><div class="spinner"></div>載入中…</div>
    <div class="fatal" id="fatal" hidden>
      <p id="fatalMsg"></p>
      <button type="button" class="ghost" id="fatalRetry">重新整理</button>
    </div>
    <section id="orders" hidden></section>
    <div id="menu"></div>
  </main>

  <div class="cartbar" id="cartbar" hidden>
    <button type="button" id="ordersOpen" class="orders-btn" hidden>
      <span>📋<span class="badge" id="ordersCount">0</span></span>
      <span class="lbl">已點</span>
    </button>
    <button type="button" id="cartOpen">
      <span class="cart-icon">🛒<span class="badge" id="cartCount" hidden>0</span></span>
      <span class="cart-total" id="cartTotal">尚未點餐</span>
      <span class="go">查看購物車</span>
    </button>
  </div>

  <!-- 購物車 → 確認餐點 -->
  <section class="sheet" id="sheet" hidden>
    <header class="sheet-head">
      <button type="button" class="back" id="sheetBack">‹ 返回</button>
      <h2 id="sheetTitle">購物車</h2>
    </header>
    <div class="sheet-body" id="sheetBody">
      <div id="cartView">
        <p class="hint" id="cartHint"></p>
        <div id="cartList"></div>
        <p class="empty" id="cartEmpty">購物車是空的,回菜單點餐吧</p>
      </div>
      <div id="checkoutView" hidden>
        <div class="card" id="checkoutList"></div>
        <div id="payBlock">
          <h3 class="step">付款方式</h3>
          <div class="pay-methods" id="payMethods"></div>
        </div>
        <h3 class="step">給店家的備註(選填)</h3>
        <textarea id="orderNote" maxlength="100" rows="2" placeholder="例:餐具 2 份、晚點到"></textarea>
        <div class="notice" id="payNotice"></div>
      </div>
    </div>
    <footer class="sheet-foot">
      <div class="sum"><span>合計</span><strong id="sheetTotal">NT$0</strong></div>
      <button type="button" class="primary big" id="sheetNext">確認餐點</button>
    </footer>
  </section>

  <!-- 已點的餐點 -->
  <section class="sheet" id="ordersSheet" hidden>
    <header class="sheet-head">
      <button type="button" class="back" id="ordersBack">‹ 返回</button>
      <h2 id="ordersTitle">已點的餐點</h2>
    </header>
    <div class="sheet-body" id="ordersBody"></div>
  </section>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
</body>
</html>
